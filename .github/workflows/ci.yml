name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development tools
        run: python -m pip install ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Test installed package
        run: python -m pytest
      - name: Smoke test CLI
        run: |
          statguard --help
          statguard --version
          python -m statguard --version

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Install wheel in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/statguard-wheel"
          "$RUNNER_TEMP/statguard-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/statguard-wheel/bin/statguard" --help
          "$RUNNER_TEMP/statguard-wheel/bin/statguard" --version
