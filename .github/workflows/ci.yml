name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development tools
        run: python -m pip install ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Test installed package
        run: python -m pytest
      - name: Smoke test CLI
        run: |
          statguard --help
          statguard --version
          python -m statguard --version

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Check wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()
          assert names, "wheel is empty"
          forbidden = (".git/", "build/", "dist/", "__pycache__/", "scripts/benchmark_statguard.py")
          unexpected = [name for name in names if any(part in name for part in forbidden)]
          assert not unexpected, f"wheel contains development artifacts: {unexpected}"
          assert any(name.startswith("statguard/") for name in names), "package missing from wheel"
          PY
      - name: Install wheel in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/statguard-wheel"
          "$RUNNER_TEMP/statguard-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/statguard-wheel/bin/statguard" --help
          "$RUNNER_TEMP/statguard-wheel/bin/statguard" --version
      - name: Self-scan installed wheel against package sources
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          mkdir -p "$WORKSPACE/build/quality"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/statguard-wheel/bin/statguard" check "$WORKSPACE/src/statguard" --format json --output "$WORKSPACE/build/quality/self-scan.json" --no-config
          "$RUNNER_TEMP/statguard-wheel/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ["WORKSPACE"]) / "build/quality/self-scan.json").read_text(encoding="utf-8"))
          assert report["tool"] == "statguard"
          assert report["summary"]["scanned_files"] > 0
          assert report["summary"]["complete_files"] == report["summary"]["scanned_files"]
          assert report["analysis_errors"] == []
          PY
      - name: Run installed-wheel benchmark smoke
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/statguard-wheel/bin/python" "$WORKSPACE/scripts/benchmark_statguard.py" --profile smoke --repeat 1 --json-output "$WORKSPACE/build/quality/benchmark-smoke.json"
          "$RUNNER_TEMP/statguard-wheel/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads((Path(os.environ["WORKSPACE"]) / "build/quality/benchmark-smoke.json").read_text(encoding="utf-8"))
          assert result["benchmark_schema_version"] == "1"
          assert result["profile"] == "smoke" and result["repeat_count"] == 1
          assert result["measurement"]["median_seconds"] > 0
          assert result["measurement"]["scanned_files"] > 0
          assert result["measurement"]["analysis_error_count"] == 0
          assert result["measurement"]["no_execution_marker_absent"] is True
          PY

  action-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package and test dependencies for Action input smoke
        run: python -m pip install ".[dev]"
      - name: Smoke test Action configuration inputs on an isolated workspace
        run: python -m pytest tests/test_github_action_runner.py -q

      - name: Scan a safe Python example
        uses: ./
        with:
          path: examples/safe_workflow.py

      - name: Findings do not fail by default
        uses: ./
        with:
          path: examples/ml_leakage_example.py

      - name: Warning threshold produces an expected failure
        id: warning_threshold
        continue-on-error: true
        uses: ./
        with:
          path: examples/ml_leakage_example.py
          fail-on: warning

      - name: Confirm warning threshold failed the Action step
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.warning_threshold.outcome }}
        shell: bash
        run: |
          python -c "import os, sys; outcome = os.environ.get('ACTION_OUTCOME'); print(f'Action outcome: {outcome}'); sys.exit(0 if outcome == 'failure' else 1)"

      - name: Disable ML001 independently
        uses: ./
        with:
          path: examples/ml_leakage_example.py
          fail-on: warning
          disable-rules: ML001

      - name: Suppress one warning with an inline directive
        uses: ./
        with:
          path: tests/fixtures/action_suppression.py
          fail-on: warning

      - name: Write a JSON report
        uses: ./
        with:
          path: examples/ml_leakage_example.py
          format: json
          output: build/action-smoke/report.json

      - name: Validate JSON report
        env:
          REPORT_PATH: build/action-smoke/report.json
        shell: bash
        run: |
          python -c "import json, os; report = json.load(open(os.environ['REPORT_PATH'], encoding='utf-8')); assert report['tool'] == 'statguard' and report['findings']; assert any(item['rule_id'] == 'ML001' for item in report['findings'])"

      - name: Write an HTML report
        uses: ./
        with:
          path: examples/ml_leakage_example.py
          format: html
          output: build/action-smoke/report.html

      - name: Validate HTML report
        env:
          REPORT_PATH: build/action-smoke/report.html
        shell: bash
        run: |
          python -c "import os; report = open(os.environ['REPORT_PATH'], encoding='utf-8').read(); assert all(value in report for value in ('StatGuard Analysis Report', 'Content-Security-Policy', 'ML001', 'confidence-filter', 'file-filter', 'Expand visible', 'Rule overview', 'data-search='))"

      - name: Write a SARIF report
        uses: ./
        with:
          path: examples/ml_leakage_example.py
          format: sarif
          output: build/action-smoke/report.sarif

      - name: Validate SARIF report
        env:
          REPORT_PATH: build/action-smoke/report.sarif
        shell: bash
        run: |
          python -c "import json, os; report = json.load(open(os.environ['REPORT_PATH'], encoding='utf-8')); run = report['runs'][0]; assert report['version'] == '2.1.0' and any(item['ruleId'] == 'ML001' for item in run['results']); assert run['results'][0]['locations'][0]['physicalLocation']['artifactLocation']['uri'].endswith('ml_leakage_example.py')"

      - name: Scan a no-execution fixture
        uses: ./
        env:
          STATGUARD_MARKER: ${{ runner.temp }}/statguard-target-executed
        with:
          path: tests/fixtures/action_no_execution.py

      - name: Confirm the scanned fixture was not executed
        env:
          STATGUARD_MARKER: ${{ runner.temp }}/statguard-target-executed
        shell: bash
        run: |
          python -c "import os, sys; sys.exit(1 if os.path.exists(os.environ['STATGUARD_MARKER']) else 0)"
